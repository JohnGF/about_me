            }
          } else {
            const src = clickable.getAttribute("data-src") || clickable.src;
            if (src) {
              openModal("img", src);
            }
          }
        }
      });

      // --- 7. PRINT ENGINE PREPARATION ---
      function preparePrintLayout() {
        if (document.getElementById("print-all-container")) return;

        const printContainer = document.createElement("div");
        printContainer.id = "print-all-container";

        slides.forEach((slide, idx) => {
          const slideDiv = document.createElement("div");
          slideDiv.className = "print-slide-page";

          // Section header tag
          const sectionTag = document.createElement("span");
          sectionTag.className =
            "text-xs font-extrabold tracking-widest text-fculblue uppercase mb-4 block";
          sectionTag.innerText = slide.section;
          slideDiv.appendChild(sectionTag);

          // Slide body content
          const bodyDiv = document.createElement("div");
          bodyDiv.className = "flex-1 flex flex-col justify-center w-full";
          bodyDiv.innerHTML = slide.html;
          slideDiv.appendChild(bodyDiv);

          // Footer section
          const footerDiv = document.createElement("div");
          footerDiv.className =
            "mt-8 pt-4 border-t border-gray-100 flex justify-between items-center text-xs text-gray-400 font-semibold w-full shrink-0";
          footerDiv.innerHTML = `
                    <span>João Garcia Farinha • Doctoral Proposal</span>
                    <span class="font-mono">${idx + 1} / ${slides.length}</span>
                `;
          slideDiv.appendChild(footerDiv);

          printContainer.appendChild(slideDiv);
        });

        document.body.appendChild(printContainer);

        // Trigger KaTeX Auto-Render inside print layout
        if (window.renderMathInElement) {
          renderMathInElement(printContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
            ],
            throwOnError: false,
          });
        }
      }

      // --- 8. START ENGINE ---
      window.onload = function () {
        renderSlide();
        preparePrintLayout();
      };
    </script>
  </body>
</html>
